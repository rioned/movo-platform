<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOVO — Rider Registration</title><style>body{font-family:system-ui,sans-serif;background:#06402a;margin:0;display:grid;place-items:center;min-height:100vh}main{background:#fff;padding:2rem;border-radius:16px;width:min(440px,90vw)}input,button{box-sizing:border-box;width:100%;padding:.75rem;margin:.4rem 0;border-radius:8px;border:1px solid #ccc}button{background:#0A6847;color:#fff;border:0;font-weight:700;cursor:pointer}#otp,#success{display:none}.error{color:#b91c1c}.hint{color:#555;font-size:.9rem}</style></head><body><main><h1>MOVO</h1><h2>Driver / Rider Registration</h2><p class="hint">Create and verify your account. Choose a car to drive Yango-style rides, or a motorcycle for parcel deliveries.</p><form id="registration-form"><select id="vehicle_type"><option value="car">Car — ride-hailing driver</option><option value="motorcycle">Motorcycle — delivery courier</option></select><input id="national_id" required placeholder="National ID"><input id="license_number" required placeholder="Driver license number"><input id="car_plate" placeholder="Car plate, e.g. AAB 123 MP"><input id="car_make" placeholder="Car make, e.g. Toyota"><input id="car_model" placeholder="Car model, e.g. Corolla"><input id="car_color" placeholder="Car color"><input id="motorcycle_plate" placeholder="Motorcycle plate, e.g. RAA123B"><input id="full_name" required placeholder="Full name"><input id="phone" required type="tel" placeholder="Phone, e.g. +2588... or +25078..."><input id="email" type="email" placeholder="Email (optional)"><input id="password" minlength="8" type="password" placeholder="Password (optional — leave blank to sign in with an SMS code only)"><button>Create account</button></form><p class="hint">Already have an account? <a href="/rider/login/">Sign in with your phone number</a></p><section id="otp"><p>Enter the 6-digit verification code.</p><input id="otp-code" inputmode="numeric" maxlength="6" placeholder="OTP"><button id="verify">Verify account</button></section><p id="message" class="error" role="alert"></p><section id="success"><h2>Account verified</h2><p>Your rider account is ready.</p></section></main><script>const role='rider';let registeredPhone='';const message=document.getElementById('message');const field=id=>document.getElementById(id).value.trim();function toggleVehicleFields(){const isCar=document.getElementById('vehicle_type').value==='car';document.getElementById('car_plate').required=isCar;document.getElementById('motorcycle_plate').required=!isCar;}document.getElementById('vehicle_type').onchange=toggleVehicleFields;toggleVehicleFields();async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Request failed');return d.data}document.getElementById('registration-form').onsubmit=async e=>{e.preventDefault();message.textContent='';const password=document.getElementById('password').value;const body={role,full_name:field('full_name'),phone:field('phone'),email:field('email')};if(password)body.password=password;for(const id of ['vehicle_type','national_id','license_number','motorcycle_plate','car_plate','car_make','car_model','car_color'])if(field(id))body[id]=field(id);try{const data=await request('/api/auth/register',body);registeredPhone=body.phone;document.getElementById('registration-form').style.display='none';document.getElementById('otp').style.display='block';message.className='hint';message.textContent='Demo OTP: '+data.otp}catch(err){message.className='error';message.textContent=err.message}};document.getElementById('verify').onclick=async()=>{try{await request('/api/auth/verify-otp',{phone:registeredPhone,otp:field('otp-code')});document.getElementById('otp').style.display='none';message.textContent='';document.getElementById('success').style.display='block'}catch(err){message.className='error';message.textContent=err.message}};</script></body></html>
